[package]
name = "tree-sitter-angelscript"
description = "AngelScript grammar for tree-sitter"
version = "0.1.0"
authors = ["MaxSensation"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "angelscript"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/maxsensation/tree-sitter-anglescript"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
  "examples/kart.as",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
